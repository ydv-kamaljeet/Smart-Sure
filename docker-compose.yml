version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: smartsure-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=smartsure
      - RABBITMQ_DEFAULT_PASS=smartsure_dev
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/

volumes:
  rabbitmq_data:
